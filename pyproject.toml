[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "maes"
version = "0.1.0"
description = "Memory-Augmented Enterprise Swarm"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "mcp>=1.0.0,<2.0.0",
    "networkx>=3.2",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
google = ["google-genai>=1.0.0"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "core*", "memory*", "mcp_servers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
